<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>readingbuddy — layout prototype</title>
<style>
/* ===========================================================================
   TOKENS — lifted verbatim from gui/src/app.css. The colour scheme is settled;
   nothing here invents a hue. Three tokens are ADDED and each is justified in
   the handoff spec: --bg-sunk, --rail, --measure-wide.
   =========================================================================== */
:root {
  --accent: #c48b3f;
  --bg: #14131a;
  --bg-raised: #1d1c25;
  --bg-sunk: #100f15;
  --line: #2e2c38;
  --ink: #e8e4dc;
  --ink-dim: #9b96a5;
  --accent-text: #c48b3f;
  --accent-on: #1a1206;
  --radius: 3px;
  --measure: 68ch;
  --measure-wide: 82ch;
  --rail: 15rem;
  --rail-r: 19rem;
  color-scheme: dark;
}
html[data-theme="light"] {
  --bg: #faf8f4;
  --bg-raised: #ffffff;
  --bg-sunk: #f2efe8;
  --line: #e2ddd2;
  --ink: #21202a;
  --ink-dim: #6a6577;
  --accent-text: #8f6114;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  font-synthesis: none;
}
a { color: inherit; text-decoration: none; }
h1, h2, h3 { font-weight: 600; letter-spacing: -0.01em; margin: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--radius); }

.band-title {
  font-size: 0.72rem; font-weight: 600; letter-spacing: 0.09em;
  text-transform: uppercase; color: var(--ink-dim); margin: 0;
}
.hint { max-width: var(--measure); color: var(--ink-dim); font-size: 0.88rem; margin: 0 0 0.5rem; }
code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.85em; color: var(--accent-text); }

/* ===========================================================================
   PROTOTYPE CHROME — deliberately NOT the app. Monospace, sunk, hairlined off.
   Nothing in this strip is a design proposal.
   =========================================================================== */
#proto {
  position: sticky; top: 0; z-index: 50;
  display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;
  padding: 0.4rem 0.75rem;
  background: var(--bg-sunk);
  border-bottom: 1px solid var(--line);
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 0.68rem; color: var(--ink-dim);
}
#proto .tag { letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.7; }
#proto button {
  font: inherit; color: var(--ink-dim); background: transparent;
  border: 1px solid var(--line); border-radius: var(--radius);
  padding: 0.15rem 0.5rem; cursor: pointer;
}
#proto button:hover { color: var(--ink); }
#proto button[aria-pressed="true"] { color: var(--accent-on); background: var(--accent); border-color: transparent; }
#proto .sep { width: 1px; height: 1rem; background: var(--line); margin: 0 0.25rem; }
#proto #layout-name { color: var(--accent-text); opacity: 0.85; }

/* ===========================================================================
   THE APP FRAME
   A thin top bar. No sidebar: the calm surface is the one with the fewest
   permanent edges, and four text links do not need a column.
   =========================================================================== */
.chrome {
  display: flex; align-items: baseline; gap: 1.25rem;
  padding: 1.1rem 2rem 1rem;
  max-width: 1400px; margin: 0 auto;
}
.chrome .mark { font-weight: 600; letter-spacing: 0.01em; color: var(--accent-text); font-size: 0.95rem; }
.chrome nav { margin-left: auto; display: flex; gap: 1.4rem; font-size: 0.85rem; color: var(--ink-dim); }
.chrome nav a { padding-bottom: 2px; border-bottom: 1px solid transparent; }
.chrome nav a:hover { color: var(--ink); }
.chrome nav a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
main { max-width: 1400px; margin: 0 auto; padding: 0 2rem 6rem; }

/* ===========================================================================
   JACKETS — procedural stand-ins for real cover bytes. In the app these are
   <img> from cover_shelf_path, falling back to the typographic plate, which is
   the third variant below.
   =========================================================================== */
.jacket {
  position: relative; aspect-ratio: 2 / 3; width: 100%;
  border-radius: var(--radius); overflow: hidden;
  display: flex; flex-direction: column; justify-content: flex-end;
  padding: 8% 9%;
  box-shadow:
    inset 0 0 0 1px color-mix(in srgb, var(--ink) 12%, transparent),
    0 1px 2px rgb(0 0 0 / 0.2),
    0 6px 14px -8px rgb(0 0 0 / 0.45);
}
.jacket .jt { font-size: 0.58rem; line-height: 1.2; font-weight: 600; letter-spacing: -0.01em; }
.jacket .ja { font-size: 0.5rem; line-height: 1.25; margin-top: 0.25em; opacity: 0.72; }
.jacket.plate { background: var(--bg-raised); color: var(--ink-dim); justify-content: center; }
.jacket.plate .jt { font-size: 0.62rem; font-style: italic; }

/* ===========================================================================
   LIBRARY — the home surface
   =========================================================================== */
.reading-band { padding-top: 0.5rem; }
.band-head {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 1rem; flex-wrap: wrap; margin-bottom: 1.1rem;
}
.reading-strip {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(310px, 1fr));
  gap: 1.25rem 2rem;
}

/* One currently-reading book, previewed. This is the ONE place on the home
   surface that carries detail — a number here describes one book you chose to
   open, never the collection. */
.preview { display: grid; grid-template-columns: 68px minmax(0, 1fr); gap: 1.1rem; align-items: start; }
.preview .jacket { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ink) 12%, transparent), 0 1px 3px rgb(0 0 0 / 0.25), 0 8px 18px -10px rgb(0 0 0 / 0.5); }
.preview .body { min-width: 0; }
.preview h3 { font-size: 0.95rem; line-height: 1.3; overflow-wrap: anywhere; }
.preview .by { font-size: 0.82rem; color: var(--ink-dim); margin: 0.15rem 0 0; }
.rail { margin: 0.7rem 0 0.35rem; height: 2px; background: var(--line); border-radius: 2px; overflow: hidden; }
.rail > i { display: block; height: 100%; background: var(--accent); }
.preview .far { font-size: 0.76rem; color: var(--ink-dim); margin: 0; }
.preview .far b { color: var(--accent-text); font-weight: 500; }
/* The latest mark. A preview of the book, per the brief — and it is the reader's
   own material, which is what makes it worth the space. */
.latest {
  margin: 0.7rem 0 0; padding-left: 0.7rem;
  border-left: 2px solid var(--line);
  font-size: 0.82rem; line-height: 1.5; color: var(--ink-dim);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.latest em { font-style: italic; color: var(--ink); }
.latest .lbl { display: block; font-size: 0.66rem; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.8; margin-bottom: 0.15rem; }
.preview .acts { margin-top: 0.6rem; display: flex; gap: 0.9rem; font-size: 0.76rem; color: var(--ink-dim); }
.preview .acts a:hover { color: var(--accent-text); }

/* The shelf proper. Small covers, large air. */
.shelf-band { margin-top: 3.4rem; }
.group { margin-top: 2.6rem; }
.group:first-of-type { margin-top: 1.4rem; }
.group-head { display: flex; align-items: center; gap: 1rem; margin-bottom: 1.1rem; }
.group-head h3 {
  font-size: 0.74rem; font-weight: 600; letter-spacing: 0.09em;
  text-transform: uppercase; color: var(--ink-dim); flex: none;
}
.group-head .rule { flex: 1; height: 1px; background: var(--line); }
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(86px, 1fr));
  gap: 1.9rem 1.4rem;
}
.tile { display: block; min-width: 0; }
.tile .jacket { transition: none; }
.tile:hover .jacket { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 45%, transparent), 0 2px 4px rgb(0 0 0 / 0.25), 0 10px 20px -10px rgb(0 0 0 / 0.5); }
.tile .cap { margin-top: 0.5rem; font-size: 0.7rem; line-height: 1.3; color: var(--ink-dim); }
.tile .cap b { display: block; color: var(--ink); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile .cap span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
body[data-caps="off"] .tile .cap { display: none; }
/* Put-down books appear on the wall unremarked. See the open question in the spec. */

/* Quiet segmented control */
.seg { display: flex; gap: 0.15rem; font-size: 0.74rem; }
.seg button {
  font: inherit; color: var(--ink-dim); background: transparent; border: 0;
  padding: 0.2rem 0.55rem; border-radius: var(--radius); cursor: pointer;
}
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { color: var(--ink); background: var(--bg-raised); }

/* ===========================================================================
   BOOK — the desk. Three columns: the book's index, the work, the connections.
   =========================================================================== */
.back { display: inline-block; font-size: 0.8rem; color: var(--ink-dim); margin: 0.2rem 0 1.1rem; }
.back:hover { color: var(--ink); }

/* The header is slim on purpose: the hero used to be a 150px jacket, and every
   pixel of it was vertical space taken from the surface people actually work on. */
.bookhead {
  display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 1.1rem;
  align-items: center; padding-bottom: 1.2rem; border-bottom: 1px solid var(--line);
}
.bookhead h1 { font-size: 1.25rem; line-height: 1.25; overflow-wrap: anywhere; }
.bookhead .meta { font-size: 0.8rem; color: var(--ink-dim); margin: 0.25rem 0 0; }
.bookhead .meta b { color: var(--accent-text); font-weight: 500; }

.desk {
  display: grid;
  grid-template-columns: var(--rail) minmax(0, 1fr) var(--rail-r);
  gap: 0 2.6rem;
  align-items: start;
}
.desk > * { min-width: 0; }
.lrail, .rrail { position: sticky; top: 1.5rem; padding-top: 1.8rem; }
.work { padding-top: 1.8rem; max-width: var(--measure-wide); }

.railsec { margin-bottom: 1.7rem; }
.railsec > .band-title { margin-bottom: 0.6rem; }
.railitems { list-style: none; margin: 0; padding: 0; }
.railitems li { margin: 0; }
.railitems a, .railitems button {
  display: flex; align-items: baseline; gap: 0.45rem; width: 100%;
  font: inherit; font-size: 0.83rem; text-align: start;
  background: none; border: 0; padding: 0.3rem 0.5rem; margin-left: -0.5rem;
  border-radius: var(--radius); color: var(--ink-dim); cursor: pointer;
}
.railitems a:hover, .railitems button:hover { color: var(--ink); background: var(--bg-raised); }
.railitems .on { color: var(--ink); background: var(--bg-raised); box-shadow: inset 2px 0 0 var(--accent); }
.railitems .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kindchip {
  flex: none; font-size: 0.6rem; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--ink-dim); border: 1px solid var(--line); border-radius: 2px; padding: 0 0.25rem;
}
.kindchip.refl { color: var(--accent-text); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
.writebtns { display: flex; flex-wrap: wrap; gap: 0.35rem; }
.btn {
  font: inherit; font-size: 0.76rem; line-height: 1.4;
  color: var(--ink-dim); background: var(--bg-raised);
  border: 1px solid var(--line); border-radius: var(--radius);
  padding: 0.22rem 0.6rem; cursor: pointer;
}
.btn:hover { color: var(--ink); }
.btn.primary { color: var(--accent-on); background: var(--accent); border-color: transparent; font-weight: 600; }
.btn.ghost { background: transparent; }

/* the work surface */
.worktitle { display: flex; align-items: baseline; gap: 0.7rem; margin-bottom: 1.1rem; flex-wrap: wrap; }
.worktitle h2 { font-size: 1.05rem; overflow-wrap: anywhere; }

/* passages */
.passage { padding: 1.1rem 0; border-bottom: 1px solid var(--line); }
.passage:first-child { padding-top: 0.2rem; }
.passage blockquote {
  margin: 0; font-size: 0.95rem; line-height: 1.65;
  padding-left: 0.9rem; border-left: 2px solid var(--line);
}
.passage.quoted blockquote { border-left-color: var(--accent); }
.passage .pmeta {
  display: flex; align-items: center; gap: 0.8rem; flex-wrap: wrap;
  margin-top: 0.6rem; padding-left: 0.9rem; font-size: 0.74rem; color: var(--ink-dim);
}
.passage .pmeta .grow { margin-left: auto; display: flex; gap: 0.35rem; opacity: 0; transition: none; }
.passage:hover .pmeta .grow, .passage:focus-within .pmeta .grow { opacity: 1; }
@media (hover: none) { .passage .pmeta .grow { opacity: 1; } }
.passage .annot {
  margin: 0.55rem 0 0 0.9rem; font-size: 0.84rem; color: var(--ink-dim);
  background: var(--bg-raised); border-radius: var(--radius); padding: 0.5rem 0.7rem;
}

/* the editor */
.noteedit input.title {
  font: inherit; font-size: 1.05rem; font-weight: 600; letter-spacing: -0.01em;
  width: 100%; color: var(--ink); background: transparent;
  border: 0; border-bottom: 1px solid var(--line); padding: 0 0 0.5rem; margin-bottom: 0.9rem;
}
.noteedit textarea {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 0.9rem; line-height: 1.75; width: 100%; min-height: 26rem;
  color: var(--ink); background: var(--bg-raised);
  border: 1px solid var(--line); border-radius: var(--radius);
  padding: 1rem 1.1rem; resize: vertical;
}
.editbar { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.7rem; }
.editbar .status { font-size: 0.76rem; color: var(--ink-dim); margin-right: auto; }
.rating { display: flex; align-items: center; gap: 0.3rem; flex-wrap: wrap; margin-top: 1.3rem; }
.rating .lbl { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-dim); margin-right: 0.3rem; }
.point { min-width: 2.1rem; text-align: center; }
.point.on { color: var(--accent-on); background: var(--accent); border-color: transparent; font-weight: 600; }

/* right rail */
.search {
  display: flex; align-items: center; gap: 0.5rem;
  background: var(--bg-raised); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 0.4rem 0.6rem;
}
.search input { font: inherit; font-size: 0.83rem; width: 100%; background: transparent; border: 0; color: var(--ink); }
.search input::placeholder { color: var(--ink-dim); }
.search .ico { color: var(--ink-dim); font-size: 0.8rem; flex: none; }
.linklist { list-style: none; margin: 0; padding: 0; font-size: 0.82rem; }
.linklist li { display: flex; align-items: baseline; gap: 0.5rem; padding: 0.35rem 0; border-bottom: 1px solid var(--line); }
.linklist li:last-child { border-bottom: 0; }
.linklist .arrow { flex: none; color: var(--ink-dim); width: 1em; font-size: 0.8rem; }
.linklist .t { min-width: 0; overflow-wrap: anywhere; }
.linklist a.t:hover { color: var(--accent-text); }
.linklist .dangling { color: var(--ink-dim); }
.linklist .pending, .linklist .side { flex: none; font-size: 0.66rem; color: var(--ink-dim); }
.counts { font-size: 0.76rem; color: var(--ink-dim); margin: 0 0 0.6rem; }
.insertable { cursor: pointer; }
.insertable:hover .t { color: var(--accent-text); }
.insertable .ins { flex: none; font-size: 0.64rem; color: var(--ink-dim); opacity: 0; }
.insertable:hover .ins { opacity: 1; }

/* ===========================================================================
   NOTES — the vault, as a place
   =========================================================================== */
.notes-head { padding-top: 0.5rem; margin-bottom: 1.6rem; }
.bigsearch {
  display: flex; align-items: center; gap: 0.7rem;
  background: var(--bg-raised); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 0.7rem 0.9rem; max-width: 46rem;
}
.bigsearch input { font: inherit; font-size: 1rem; width: 100%; background: transparent; border: 0; color: var(--ink); }
.bigsearch input::placeholder { color: var(--ink-dim); }
.filters { display: flex; align-items: center; gap: 1.2rem; margin-top: 0.9rem; flex-wrap: wrap; }
.vault {
  display: grid; grid-template-columns: minmax(0, var(--measure)) 22rem;
  gap: 0 2.6rem; align-items: start; max-width: calc(var(--measure) + 25rem);
}
.results { list-style: none; margin: 0; padding: 0; max-width: var(--measure); }
.results li { border-bottom: 1px solid var(--line); }
.results button {
  display: block; width: 100%; text-align: start; font: inherit;
  background: none; border: 0; padding: 0.9rem 0.6rem; margin: 0 -0.6rem;
  color: inherit; cursor: pointer; border-radius: var(--radius);
}
.results button:hover { background: var(--bg-raised); }
.results .on { background: var(--bg-raised); box-shadow: inset 2px 0 0 var(--accent); }
.results .rtop { display: flex; align-items: baseline; gap: 0.6rem; flex-wrap: wrap; }
.results .rtitle { font-size: 0.95rem; font-weight: 500; }
.results .rbook { font-size: 0.76rem; color: var(--ink-dim); margin-left: auto; }
.results .rsnip { font-size: 0.84rem; line-height: 1.55; color: var(--ink-dim); margin: 0.35rem 0 0; }
.results mark { background: color-mix(in srgb, var(--accent) 30%, transparent); color: var(--ink); border-radius: 2px; padding: 0 0.1em; }
.preview-rail { position: sticky; top: 1.5rem; border-left: 1px solid var(--line); padding-left: 2rem; }
.preview-rail .body {
  font-size: 0.86rem; line-height: 1.7; color: var(--ink-dim);
  white-space: pre-wrap; max-height: 15rem; overflow: hidden;
  -webkit-mask-image: linear-gradient(to bottom, #000 70%, transparent);
  mask-image: linear-gradient(to bottom, #000 70%, transparent);
}

/* ===========================================================================
   READING LIFE
   =========================================================================== */
.life { display: grid; grid-template-columns: 9rem minmax(0, 1fr); gap: 0 2.6rem; align-items: start; padding-top: 0.5rem; }
.years { position: sticky; top: 1.5rem; list-style: none; margin: 0; padding: 0; }
.years button {
  font: inherit; font-size: 0.85rem; width: 100%; text-align: start;
  background: none; border: 0; padding: 0.3rem 0.5rem; margin-left: -0.5rem;
  border-radius: var(--radius); color: var(--ink-dim); cursor: pointer;
}
.years button:hover { color: var(--ink); }
.years .on { color: var(--ink); background: var(--bg-raised); box-shadow: inset 2px 0 0 var(--accent); }
.month { display: grid; grid-template-columns: 7rem minmax(0, 1fr); gap: 1.4rem; padding: 1.2rem 0; border-bottom: 1px solid var(--line); align-items: start; }
.month h3 { font-size: 0.85rem; font-weight: 500; color: var(--ink-dim); padding-top: 0.1rem; }
.month .facts { font-size: 0.88rem; line-height: 1.7; max-width: var(--measure); }
.month .facts .absent { color: var(--ink-dim); font-style: italic; }
.month .covers { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.6rem; }
.month .covers .tile { width: 40px; }
.month .covers .jacket .jt, .month .covers .jacket .ja { display: none; }
.month .covers .jacket.plate .jt { display: block; }

/* ===========================================================================
   CARDS
   =========================================================================== */
.wall { display: grid; grid-template-columns: repeat(auto-fill, minmax(258px, 1fr)); gap: 1.6rem; padding-top: 0.5rem; }
.card {
  background: var(--bg-raised); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 1.1rem 1.2rem 1.2rem; display: grid; grid-template-columns: 48px minmax(0,1fr); gap: 0 0.9rem;
}
.card .jacket { grid-row: span 2; }
.card h3 { font-size: 0.9rem; line-height: 1.3; }
.card .by { font-size: 0.76rem; color: var(--ink-dim); margin: 0.15rem 0 0; }
.card .when { grid-column: 1 / -1; font-size: 0.72rem; color: var(--ink-dim); margin-top: 0.9rem; padding-top: 0.7rem; border-top: 1px solid var(--line); display: flex; gap: 0.7rem; flex-wrap: wrap; }
.card .when b { color: var(--accent-text); font-weight: 500; }
.card .pass { grid-column: 1 / -1; margin: 0.8rem 0 0; font-size: 0.84rem; line-height: 1.6; font-style: italic; color: var(--ink-dim); padding-left: 0.8rem; border-left: 2px solid var(--line); }

/* ===========================================================================
   RESPONSIVE — the rails are the first thing to go, in this order:
   right rail (connections fold under the work), then left rail (index becomes
   a row of chips above the work).
   =========================================================================== */
@media (max-width: 1180px) {
  .desk { grid-template-columns: var(--rail) minmax(0, 1fr); }
  .rrail { grid-column: 2; position: static; padding-top: 2.4rem; border-top: 1px solid var(--line); }
  .vault { grid-template-columns: minmax(0, 1fr); }
  .preview-rail { border-left: 0; padding-left: 0; position: static; margin-top: 2.4rem; padding-top: 1.6rem; border-top: 1px solid var(--line); }
}
@media (max-width: 860px) {
  main, .chrome { padding-left: 1.25rem; padding-right: 1.25rem; }
  .desk { grid-template-columns: minmax(0, 1fr); }
  .rrail { grid-column: auto; }
  .lrail { position: static; padding-top: 1.6rem; }
  .life { grid-template-columns: minmax(0, 1fr); }
  .years { position: static; display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 1.2rem; }
  .years button { width: auto; }
  .month { grid-template-columns: minmax(0, 1fr); gap: 0.4rem; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(74px, 1fr)); gap: 1.5rem 1.1rem; }
}

/* ===========================================================================
   LAYOUT VARIANTS — what the "layout" button in the prototype strip shuffles.
   Six whole-app arrangements. Each is a coherent proposal rather than a knob:
   the shell, the library and the desk move together, because a nav that has
   become a column changes what the desk's own rails mean. Same markup, same
   tokens, same data — nothing here invents a hue or a component.

   Scoped to >=1181px on purpose. Below that the responsive rules above are the
   design for every variant: a layout proposal is an argument about a wide
   window, and letting one of them win on a phone would be reviewing a bug.
   =========================================================================== */
@media (min-width: 1181px) {

/* --- 2 · rail — a fixed nav column; the desk index becomes a row of chips ---
   Buys the whole window width for the work and makes "where you are" permanent.
   Costs the calm the no-sidebar argument was protecting: a permanent edge. */
html[data-layout="rail"] .chrome {
  position: fixed; top: var(--proto-h, 2.1rem); left: 0; bottom: 0; width: 13rem;
  flex-direction: column; align-items: stretch; gap: 1.6rem;
  max-width: none; margin: 0; padding: 1.5rem 1.1rem;
  background: var(--bg-sunk); border-right: 1px solid var(--line); z-index: 20;
}
html[data-layout="rail"] .chrome nav { margin-left: 0; flex-direction: column; gap: 0.15rem; }
html[data-layout="rail"] .chrome nav a { padding: 0.3rem 0.5rem; margin-left: -0.5rem; border-bottom: 0; border-radius: var(--radius); }
html[data-layout="rail"] .chrome nav a:hover { background: var(--bg-raised); }
html[data-layout="rail"] .chrome nav a[aria-current="page"] { background: var(--bg-raised); box-shadow: inset 2px 0 0 var(--accent); }
html[data-layout="rail"] main { margin-left: 13rem; max-width: 1240px; padding-top: 1.6rem; }
html[data-layout="rail"] .desk { grid-template-columns: minmax(0, 1fr) var(--rail-r); }
html[data-layout="rail"] .lrail { grid-column: 1 / -1; position: static; padding-top: 1.4rem; }
/* Each rail section becomes one line — heading, then its chips — or the index
   costs more vertical space as a row than it did as a column. */
html[data-layout="rail"] .lrail .railsec { display: flex; align-items: baseline; gap: 0.9rem; margin-bottom: 0.55rem; }
html[data-layout="rail"] .lrail .railsec > .band-title { flex: none; width: 8rem; margin-bottom: 0; }
html[data-layout="rail"] .lrail .railitems { display: flex; flex-wrap: wrap; gap: 0.3rem; }
html[data-layout="rail"] .lrail .railitems a { border: 1px solid var(--line); padding: 0.2rem 0.5rem; margin: 0; }
html[data-layout="rail"] .lrail .railitems .on { box-shadow: none; border-color: color-mix(in srgb, var(--accent) 55%, transparent); }

/* --- 3 · focus — one reading proud, the wall very small --------------------
   The strongest reading of "calming": the home surface is the book you are in,
   and the shelf is the texture behind it. Both desk rails stack to the right,
   so the work surface is the widest of any variant. */
html[data-layout="focus"] .reading-strip { grid-template-columns: minmax(0, 1fr); gap: 1.8rem; }
html[data-layout="focus"] .preview { grid-template-columns: 92px minmax(0, 1fr); max-width: 44rem; }
html[data-layout="focus"] .preview:first-child { grid-template-columns: 148px minmax(0, 1fr); gap: 1.6rem; max-width: 58rem; }
html[data-layout="focus"] .preview:first-child h3 { font-size: 1.3rem; }
html[data-layout="focus"] .preview:first-child .latest { -webkit-line-clamp: 6; font-size: 0.9rem; }
html[data-layout="focus"] .preview:not(:first-child) .latest,
html[data-layout="focus"] .preview:not(:first-child) .acts { display: none; }
html[data-layout="focus"] .grid { grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); gap: 1.2rem 0.9rem; }
html[data-layout="focus"] .tile .cap { display: none; }
html[data-layout="focus"] .desk { grid-template-columns: minmax(0, 1fr) var(--rail-r); }
html[data-layout="focus"] .lrail { grid-column: 2; grid-row: 1; }
html[data-layout="focus"] .work { grid-column: 1; grid-row: 1 / span 2; max-width: none; }
html[data-layout="focus"] .rrail { grid-column: 2; grid-row: 2; position: static; padding-top: 0.4rem; }

/* --- 4 · column — one measure, everything stacked, nothing sticky ----------
   The quietest and the most scroll. Worth looking at because it is the only
   variant where the note editor and its links are never on screen together —
   which is the thing the three-column desk was built to buy. */
html[data-layout="column"] .chrome,
html[data-layout="column"] main { max-width: 64rem; }
html[data-layout="column"] .reading-strip { grid-template-columns: minmax(0, 1fr); }
html[data-layout="column"] .grid { grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); }
html[data-layout="column"] .desk,
html[data-layout="column"] .vault,
html[data-layout="column"] .life { grid-template-columns: minmax(0, 1fr); }
html[data-layout="column"] .lrail,
html[data-layout="column"] .rrail,
html[data-layout="column"] .preview-rail,
html[data-layout="column"] .years { position: static; }
html[data-layout="column"] .lrail { padding-top: 1.2rem; }
html[data-layout="column"] .lrail .railsec { display: flex; align-items: baseline; gap: 0.9rem; margin-bottom: 0.55rem; }
html[data-layout="column"] .lrail .railsec > .band-title { flex: none; width: 8rem; margin-bottom: 0; }
html[data-layout="column"] .lrail .railitems { display: flex; flex-wrap: wrap; gap: 0.3rem; }
html[data-layout="column"] .lrail .railitems a { border: 1px solid var(--line); padding: 0.2rem 0.5rem; margin: 0; }
html[data-layout="column"] .work { max-width: none; }
html[data-layout="column"] .rrail { grid-column: auto; margin-top: 2.4rem; padding-top: 1.6rem; border-top: 1px solid var(--line); }
html[data-layout="column"] .preview-rail { border-left: 0; padding-left: 0; margin-top: 2.4rem; padding-top: 1.6rem; border-top: 1px solid var(--line); }
html[data-layout="column"] .years { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 1.2rem; }
html[data-layout="column"] .years button { width: auto; }
html[data-layout="column"] .wall { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }

/* --- 5 · panels — every region is a raised card with an edge ---------------
   The opposite bet from the baseline: structure carried by borders instead of
   by air. Easier to scan, and it is the variant most likely to read as an
   admin console rather than a place — which is exactly why it is on the list
   rather than assumed away. */
html[data-layout="panels"] .preview,
html[data-layout="panels"] .group,
html[data-layout="panels"] .lrail,
html[data-layout="panels"] .rrail,
html[data-layout="panels"] .preview-rail,
html[data-layout="panels"] .passage,
html[data-layout="panels"] .month {
  background: var(--bg-raised); border: 1px solid var(--line); border-radius: var(--radius);
}
html[data-layout="panels"] .preview { padding: 1rem 1.1rem; }
html[data-layout="panels"] .group { padding: 1.1rem 1.2rem 1.4rem; }
html[data-layout="panels"] .lrail,
html[data-layout="panels"] .rrail { padding: 1.2rem 1.1rem; }
html[data-layout="panels"] .railsec:last-child { margin-bottom: 0; }
html[data-layout="panels"] .preview-rail { padding: 1.2rem; }
html[data-layout="panels"] .passage { padding: 1rem 1.1rem; margin-bottom: 0.9rem; border-bottom: 1px solid var(--line); }
html[data-layout="panels"] .passage .annot,
html[data-layout="panels"] .noteedit textarea { background: var(--bg); }
html[data-layout="panels"] .month { padding: 1.1rem 1.2rem; margin-bottom: 0.9rem; }

/* --- 6 · split — the reading column stays put while the shelf scrolls ------
   The library becomes two surfaces at once: what you are in, always on screen,
   beside what you have read. On the desk both rails go left, so the work is
   one wide surface with all its context on one side. */
html[data-layout="split"] #view[data-route="#/library"] {
  display: grid; grid-template-columns: 25rem minmax(0, 1fr); gap: 0 3rem; align-items: start;
}
html[data-layout="split"] #view[data-route="#/library"] > section:only-child { grid-column: 1 / -1; }
html[data-layout="split"] #view[data-route="#/library"] .reading-band { position: sticky; top: 1.5rem; }
html[data-layout="split"] .reading-strip { grid-template-columns: minmax(0, 1fr); gap: 1.6rem; }
html[data-layout="split"] .preview { grid-template-columns: 56px minmax(0, 1fr); gap: 0.9rem; }
html[data-layout="split"] .shelf-band { margin-top: 0; padding-top: 0.4rem; }
html[data-layout="split"] .desk { grid-template-columns: var(--rail-r) minmax(0, 1fr); }
html[data-layout="split"] .lrail { grid-column: 1; grid-row: 1; position: static; }
html[data-layout="split"] .rrail { grid-column: 1; grid-row: 2; position: static; padding-top: 0; }
html[data-layout="split"] .work { grid-column: 2; grid-row: 1 / span 2; max-width: none; }

}
</style>
</head>
<body data-caps="off">

<div id="proto">

</div>

<header class="chrome">

  <nav>
    <a href="#/library" data-nav="library">Library</a>
    <a href="#/notes" data-nav="notes">Notes</a>
    <a href="#/cards" data-nav="cards">Cards</a>
    <a href="#/life" data-nav="life">Reading life</a>
  </nav>
</header>

<main id="view"></main>

<script>
/* ---------------------------------------------------------------------------
   FAKE DATA. Shapes deliberately mirror the API DTOs so the spec can name a
   source for every field on screen.
   --------------------------------------------------------------------------- */
const H = [206, 28, 152, 344, 44, 268, 96, 12, 190, 320, 68, 240];
function jacket(b, i) {
  if (b.plate) return `<div class="jacket plate"><span class="jt">${b.title || "Untitled"}</span></div>`;
  const h = H[i % H.length], h2 = (h + 26) % 360;
  const bg = `linear-gradient(160deg, hsl(${h} 22% 34%) 0%, hsl(${h2} 26% 22%) 100%)`;
  const bar = `<span style="position:absolute;left:0;right:0;top:${18 + (i % 4) * 9}%;height:${2 + (i % 3)}px;background:hsl(${h2} 40% 62% / .5)"></span>`;
  return `<div class="jacket" style="background:${bg};color:hsl(${h} 30% 92%)">${bar}
    <span class="jt">${b.title}</span><span class="ja">${b.author}</span></div>`;
}

const READING = [
  { title: "The Overstory", author: "Richard Powers", page: 214, pages: 502, pct: 43,
    started: "12 March", markKind: "Latest note",
    mark: "<em>Trees as a time-scale argument</em> — the novel keeps switching the unit of time and daring you to keep up." },
  { title: "Piranesi", author: "Susanna Clarke", page: 98, pages: 245, pct: 40,
    started: "2 August", markKind: "Latest passage",
    mark: "<em>“The Beauty of the House is immeasurable; its Kindness infinite.”</em> p. 96" },
  { title: "水滸傳", author: "施耐庵", page: 61, pages: 1200, pct: 5,
    started: "29 July", markKind: "Latest passage",
    mark: "<em>“智深走到面前，那漢子撇了棒。”</em> p. 58" },
];

const SHELF = [
  { y: "2026", books: [
    {title:"Autumn", author:"Ali Smith"}, {title:"Solenoid", author:"Mircea Cărtărescu"},
    {title:"A Ghost in the Throat", author:"Doireann Ní Ghríofa"}, {title:"Trust", author:"Hernan Diaz"},
    {title:"The Employees", author:"Olga Ravn"}, {title:"Checkout 19", author:"Claire-Louise Bennett"},
    {title:"Ulysses", author:"James Joyce", down:true},
  ]},
  { y: "2025", books: [
    {title:"Gödel, Escher, Bach", author:"Douglas Hofstadter"}, {title:"Klara and the Sun", author:"Kazuo Ishiguro"},
    {title:"The Rings of Saturn", author:"W. G. Sebald"}, {title:"Pond", author:"Claire-Louise Bennett"},
    {title:"Milkman", author:"Anna Burns"}, {title:"Ducks, Newburyport", author:"Lucy Ellmann"},
    {title:"Second Place", author:"Rachel Cusk"}, {title:"Outline", author:"Rachel Cusk"},
  ]},
  { y: "2024", books: [
    {title:"Infinite Jest", author:"David Foster Wallace"}, {title:"The Master and Margarita", author:"Mikhail Bulgakov"},
    {title:"Der Zauberberg", author:"Thomas Mann"}, {title:"如果在冬夜，一個旅人", author:"伊塔羅·卡爾維諾"},
    {title:"Beloved", author:"Toni Morrison"}, {title:"The Left Hand of Darkness", author:"Ursula K. Le Guin"},
    {title:"Stoner", author:"John Williams"},
  ]},
  { y: "No reading recorded", books: [
    {title:"The Books of Jacob", author:"Olga Tokarczuk"}, {title:"Tristram Shandy", author:"Laurence Sterne"},
    {title:"", author:"", plate:true},
  ]},
];

const NOTES = [
  { id:1, kind:"Reflection", title:"The Overstory — reflection" },
  { id:2, kind:"Review", title:"The Overstory — review" },
  { id:3, kind:"", title:"Trees as a time-scale argument" },
  { id:4, kind:"", title:"Patricia Westerford and the discredited-scientist arc" },
  { id:5, kind:"", title:"p. 214 — the chestnut photographs" },
];

const PASSAGES = [
  { p: 214, quoted: true, text: "The photographs, each one a year apart, taken from the same spot on the same porch, of a chestnut that outlives the family photographing it.",
    annot: "This is the whole book in one image: the tree is the constant and the humans are the flicker.", cards: 1 },
  { p: 188, quoted: false, text: "You and the tree in your backyard come from a common ancestor. A billion and a half years ago, the two of you parted ways.", annot: null, cards: 0 },
  { p: 151, quoted: true, text: "The best arguments in the world won’t change a person’s mind. The only thing that can do that is a good story.", annot: null, cards: 0 },
  { p: 97, quoted: false, text: "A forest knows things. They wire themselves up underground. There are brains down there, ones our own brains aren’t shaped to see.", annot: "Compare Sebald — the underground network as a figure for memory rather than for ecology.", cards: 2 },
];

const LINKS_OUT = [
  { t: "Deep time", exists: true },
  { t: "The Rings of Saturn — reflection", exists: true },
  { t: "Slow violence", exists: false },
];
const LINKS_IN = [
  { t: "The Overstory — reflection", exists: true },
  { t: "Solenoid — reflection", exists: true },
];

const VAULT = [
  { t: "Deep time", book: "in the vault", kind: "", snip: "Every book that works on me does the same trick: it changes the <mark>unit of time</mark> I am reading in, and then refuses to change it back." },
  { t: "The Rings of Saturn — reflection", book: "The Rings of Saturn", kind: "Reflection", snip: "Sebald walks and the walk is the argument. The digressions are not digressions — they are the <mark>time-scale</mark> the book actually operates on." },
  { t: "Trees as a time-scale argument", book: "The Overstory", kind: "", snip: "The novel keeps switching the <mark>unit of time</mark> and daring you to keep up: a chapter is a life, then a chapter is a century." },
  { t: "Solenoid — reflection", book: "Solenoid", kind: "Reflection", snip: "Cărtărescu does with space what Powers does with <mark>time</mark> — the building keeps being larger than the building." },
  { t: "Slow violence", book: "in the vault", kind: "", snip: "No note written. Three notes link here, and the edge completes the day one is." },
];

const NOTE_BODY = `The novel keeps switching the unit of time and daring you to keep up.

A chapter is a life. Then a chapter is a century, and the life you just read
is one sentence inside it. The trick only works because Powers refuses to
signal the change — you notice you have been rescaled after the fact.

Compare [[The Rings of Saturn — reflection]]: Sebald does this with the walk,
where the digression *is* the time-scale rather than a departure from it.

The thing I still have no word for is [[Slow violence]] — damage that is
too slow to photograph. That is the register the chestnut photographs on
p. 214 are working in.

See also [[Deep time]].`;

/* --------------------------------------------------------------------------- */
const $ = (s, r=document) => r.querySelector(s);
const view = $("#view");
let state = { shelfSort: "year", empty: false, work: "passages", vaultSel: 0, year: "2026" };

function libraryView() {
  if (state.empty) return `
    <section style="padding-top:3rem;max-width:42rem">
      <p class="band-title" style="margin-bottom:1rem">Library</p>
      <p style="font-size:1.05rem;margin:0 0 0.8rem">Nothing on the shelf.</p>
      <p class="hint"><code>rb epub &lt;file&gt;</code> adds a book from a file.
      <code>rb ko pull</code> takes what is on a connected reader. Neither needs a network.</p>
    </section>`;

  const groups = SHELF.map(g => `
    <div class="group">
      <div class="group-head"><h3>${g.y}</h3><div class="rule"></div></div>
      <div class="grid">
        ${g.books.map((b, i) => `
          <a class="tile" href="#/book" title="${b.title || "Untitled"}${b.author ? " — " + b.author : ""}">
            ${jacket(b, i + g.y.length)}
            <div class="cap"><b>${b.title || "Untitled"}</b><span>${b.author || "—"}</span></div>
          </a>`).join("")}
      </div>
    </div>`).join("");

  return `
  <section class="reading-band">
    <div class="band-head"><h2 class="band-title">Reading now</h2></div>
    <div class="reading-strip">
      ${READING.map((b, i) => `
        <div class="preview">
          <a href="#/book">${jacket(b, i)}</a>
          <div class="body">
            <h3><a href="#/book">${b.title}</a></h3>
            <p class="by">${b.author}</p>
            <div class="rail"><i style="width:${b.pct}%"></i></div>
            <p class="far"><b>p. ${b.page}</b> of ${b.pages} · ${b.pct}% · started ${b.started}</p>
            <p class="latest"><span class="lbl">${b.markKind}</span>${b.mark}</p>
            <p class="acts"><a href="#/note">Write</a><a href="#/book">Passages</a></p>
          </div>
        </div>`).join("")}
    </div>
  </section>

  <section class="shelf-band">
    <div class="band-head">
      <h2 class="band-title">The shelf</h2>
      <div class="seg">
        ${["year","author","title","recent"].map(s =>
          `<button data-sort="${s}" aria-pressed="${state.shelfSort===s}">${s[0].toUpperCase()+s.slice(1)}</button>`).join("")}
      </div>
    </div>
    ${groups}
  </section>`;
}

function railHTML(active) {
  return `
  <div class="railsec">
    <p class="band-title">Write</p>
    <div class="writebtns">
      <button class="btn">Note</button><button class="btn">Reflection</button><button class="btn">Review</button>
    </div>
  </div>
  <div class="railsec">
    <p class="band-title">What you wrote</p>
    <ul class="railitems">
      ${NOTES.map(n => `<li><a href="#/note" class="${active==='note'&&n.id===3?'on':''}">
        ${n.kind ? `<span class="kindchip ${n.kind==='Reflection'?'refl':''}">${n.kind}</span>` : ""}
        <span class="t">${n.title}</span></a></li>`).join("")}
    </ul>
  </div>
  <div class="railsec">
    <p class="band-title">The book</p>
    <ul class="railitems">
      <li><a href="#/book" class="${active==='passages'?'on':''}"><span class="t">Passages</span></a></li>
      <li><a href="#/book" class="${active==='reads'?'on':''}"><span class="t">Reads</span></a></li>
      <li><a href="#/book" class="${active==='about'?'on':''}"><span class="t">About &amp; sources</span></a></li>
      <li><a href="#/cards"><span class="t">Cards →</span></a></li>
    </ul>
  </div>`;
}

function bookHead() {
  return `
  <a class="back" href="#/library">← Library</a>
  <div class="bookhead">
    <div>${jacket(READING[0], 0)}</div>
    <div>
      <h1>The Overstory</h1>
      <p class="meta">Richard Powers · 2018 · 502 pages &nbsp;·&nbsp; <b>Reading · p. 214 · 43%</b> · started 12 March</p>
    </div>
  </div>`;
}

function passagesView() {
  return `${bookHead()}
  <div class="desk">
    <aside class="lrail">${railHTML("passages")}</aside>
    <div class="work">
      <div class="worktitle"><h2>Passages</h2>
        <span class="hint" style="margin:0">Marked on the device. A ruled edge means some note quotes it.</span></div>
      ${PASSAGES.map(p => `
        <div class="passage ${p.quoted ? "quoted" : ""}">
          <blockquote>${p.text}</blockquote>
          ${p.annot ? `<p class="annot">${p.annot}</p>` : ""}
          <div class="pmeta">
            <span>p. ${p.p}</span>
            ${p.quoted ? `<span style="color:var(--accent-text)">quoted</span>` : ""}
            ${p.cards ? `<span>${p.cards} card${p.cards>1?"s":""} captured</span>` : ""}
            <span class="grow">
              <button class="btn ghost">Annotate</button>
              <button class="btn ghost">Capture a word</button>
              <button class="btn ghost">Cite</button>
            </span>
          </div>
        </div>`).join("")}
    </div>
    <aside class="rrail">
      <div class="railsec">
        <p class="band-title" style="margin-bottom:0.6rem">Search this book</p>
        <div class="search"><span class="ico">⌕</span><input placeholder="Notes and passages…" /></div>
      </div>
      <div class="railsec">
        <p class="band-title" style="margin-bottom:0.6rem">Reads</p>
        <ul class="linklist">
          <li><span class="t">12 March 2026 — reading</span><span class="side">koreader</span></li>
          <li><span class="t">4 Jan – 2 Feb 2024 — finished</span><span class="side">goodreads</span></li>
        </ul>
      </div>
    </aside>
  </div>`;
}

function noteView() {
  return `${bookHead()}
  <div class="desk">
    <aside class="lrail">${railHTML("note")}</aside>
    <div class="work">
      <div class="noteedit">
        <input class="title" value="Trees as a time-scale argument" />
        <textarea spellcheck="true">${NOTE_BODY}</textarea>
        <div class="editbar">
          <span class="status">Saved · in your vault as <code>trees-as-a-time-scale-argument.md</code></span>
          <button class="btn">Delete</button>
          <button class="btn primary">Save</button>
        </div>
      </div>
    </div>
    <aside class="rrail">
      <div class="railsec">
        <p class="band-title" style="margin-bottom:0.6rem">Links</p>
        <p class="counts">3 out · 2 in</p>
        <ul class="linklist">
          ${LINKS_OUT.map(l => `<li><span class="arrow">→</span>${l.exists
            ? `<a class="t" href="#/note">${l.t}</a>`
            : `<span class="t dangling">${l.t}</span><span class="pending">no note</span>`}</li>`).join("")}
          ${LINKS_IN.map(l => `<li><span class="arrow">←</span><a class="t" href="#/note">${l.t}</a></li>`).join("")}
        </ul>
      </div>
      <div class="railsec">
        <p class="band-title" style="margin-bottom:0.6rem">Link to…</p>
        <div class="search" style="margin-bottom:0.6rem"><span class="ico">⌕</span><input placeholder="Any note in your vault" /></div>
        <ul class="linklist">
          ${VAULT.slice(0,4).map(v => `<li class="insertable"><span class="t">${v.t}</span><span class="ins">insert [[ ]]</span></li>`).join("")}
        </ul>
      </div>
      <div class="railsec">
        <p class="band-title" style="margin-bottom:0.6rem">Cited passages</p>
        <ul class="linklist">
          <li><span class="t">p. 214 — “The photographs, each one a year apart…”</span></li>
          <li><span class="t">p. 151 — “The best arguments in the world won’t…”</span></li>
        </ul>
        <p class="hint" style="margin-top:0.6rem">Cite from a passage in the book’s passage list.</p>
      </div>
    </aside>
  </div>`;
}

function notesView() {
  const sel = VAULT[state.vaultSel];
  return `
  <div class="notes-head">
    <div class="bigsearch"><span class="ico" style="color:var(--ink-dim)">⌕</span>
      <input value="time-scale" /></div>
    <div class="filters">
      <div class="seg">
        ${["All","Notes","Reflections","Reviews"].map((k,i)=>`<button aria-pressed="${i===0}">${k}</button>`).join("")}
      </div>
      <span class="hint" style="margin:0">Full text, every note in the vault, and the highlights too.</span>
    </div>
  </div>
  <div class="vault">
    <ul class="results">
      ${VAULT.map((v, i) => `
        <li><button data-vault="${i}" class="${i===state.vaultSel?"on":""}">
          <span class="rtop">
            <span class="rtitle">${v.t}</span>
            ${v.kind ? `<span class="kindchip ${v.kind==="Reflection"?"refl":""}">${v.kind}</span>` : ""}
            <span class="rbook">${v.book}</span>
          </span>
          <p class="rsnip">${v.snip}</p>
        </button></li>`).join("")}
    </ul>
    <aside class="preview-rail">
      <p class="band-title" style="margin-bottom:0.7rem">${sel.t}</p>
      <p class="counts">${sel.book === "in the vault" ? "Not anchored to a book" : sel.book} · 3 out · 2 in</p>
      <div class="body">${NOTE_BODY}</div>
      <div style="margin-top:0.9rem;display:flex;gap:0.4rem;flex-wrap:wrap">
        <a class="btn" href="#/note">Open</a><a class="btn" href="#/book">Go to the book</a>
      </div>
      <div class="railsec" style="margin-top:1.8rem">
        <p class="band-title" style="margin-bottom:0.6rem">Links</p>
        <ul class="linklist">
          ${LINKS_OUT.map(l => `<li><span class="arrow">→</span>${l.exists
            ? `<a class="t" href="#/note">${l.t}</a>`
            : `<span class="t dangling">${l.t}</span><span class="pending">no note</span>`}</li>`).join("")}
          ${LINKS_IN.map(l => `<li><span class="arrow">←</span><a class="t" href="#/note">${l.t}</a></li>`).join("")}
        </ul>
      </div>
    </aside>
  </div>`;
}

function lifeView() {
  const months = [
    { m: "August", facts: `Read on <b>6 days</b>, across <b>2 books</b>. Wrote <b>4 notes</b>.`,
      absent: "No reading time recorded — the device has not been connected this month.", covers: 0 },
    { m: "July", facts: `Finished <b>Checkout 19</b> and <b>The Employees</b>. Wrote <b>9 notes</b> and made <b>14 links</b>.`,
      absent: "No reading time recorded.", covers: 2 },
    { m: "June", facts: `Wrote <b>3 notes</b>, one of them a reflection that reached <b>Solenoid</b> for the first time.`,
      absent: null, covers: 0 },
    { m: "May", facts: `Finished <b>Trust</b>. Read on <b>19 days</b>. <b>11 hours</b> in the book, measured on the device.`,
      absent: null, covers: 1 },
  ];
  return `
  <div class="life">
    <ul class="years">
      ${["2026","2025","2024"].map(y => `<li><button data-year="${y}" class="${state.year===y?"on":""}">${y}</button></li>`).join("")}
    </ul>
    <div>
      <p class="hint" style="margin-bottom:1.4rem">What you did, month by month. Everything here is past tense, and a month that does not know something says so.</p>
      ${months.map(mo => `
        <div class="month">
          <h3>${mo.m}</h3>
          <div class="facts">
            <p style="margin:0">${mo.facts}</p>
            ${mo.absent ? `<p class="absent" style="margin:0.3rem 0 0">${mo.absent}</p>` : ""}
            ${mo.covers ? `<div class="covers">${SHELF[0].books.slice(0, mo.covers).map((b,i)=>`<a class="tile" href="#/book">${jacket(b,i+3)}</a>`).join("")}</div>` : ""}
          </div>
        </div>`).join("")}
    </div>
  </div>`;
}

function cardsView() {
  const cards = [
    { b: SHELF[0].books[1], when: "4 Jan – 2 Feb 2026", rating: "4 / 5", pass: "“The building keeps being larger than the building.”" },
    { b: SHELF[1].books[2], when: "18 Sep – 30 Oct 2025", rating: "5 / 5", pass: "“The shadow of a walk is longer than the walk.”" },
    { b: SHELF[2].books[0], when: "1 Mar – 14 Aug 2024", rating: null, pass: "“Everything is play, and play is everything.”" },
    { b: SHELF[0].books[6], when: "put down 3 May 2026 · p. 201", rating: null, pass: "“Ineluctable modality of the visible.”" },
  ];
  return `
  <p class="hint" style="padding-top:0.5rem;margin-bottom:1.4rem">One card per reading — so a book read twice has two, side by side.</p>
  <div class="wall">
    ${cards.map((c, i) => `
      <div class="card">
        ${jacket(c.b, i + 2)}
        <div><h3>${c.b.title}</h3><p class="by">${c.b.author}</p></div>
        <div class="when"><span>${c.when}</span>${c.rating ? `<b>${c.rating}</b>` : ""}</div>
        <p class="pass">${c.pass}</p>
      </div>`).join("")}
  </div>`;
}

const ROUTES = {
  "#/library": { nav: "library", render: libraryView },
  "#/book":    { nav: "library", render: passagesView },
  "#/note":    { nav: "library", render: noteView },
  "#/notes":   { nav: "notes",   render: notesView },
  "#/life":    { nav: "life",    render: lifeView },
  "#/cards":   { nav: "cards",   render: cardsView },
};

function render() {
  const r = ROUTES[location.hash] || ROUTES["#/library"];
  view.innerHTML = r.render();
  /* The `split` layout re-lays the library's two bands and must not touch any
     other route, so the route is on the container rather than in a selector
     that would have to name every band. */
  view.dataset.route = location.hash || "#/library";
  document.querySelectorAll("[data-nav]").forEach(a =>
    a.toggleAttribute("aria-current", a.dataset.nav === r.nav) );
  document.querySelectorAll("[data-nav]").forEach(a => {
    if (a.dataset.nav === r.nav) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  });
  document.querySelectorAll("#proto [data-go]").forEach(b =>
    b.setAttribute("aria-pressed", b.dataset.go === (location.hash || "#/library")));
  window.scrollTo(0, 0);
}
addEventListener("hashchange", render);

document.addEventListener("click", (e) => {
  const go = e.target.closest("[data-go]");
  if (go) { location.hash = go.dataset.go; return; }
  const s = e.target.closest("[data-sort]");
  if (s) { state.shelfSort = s.dataset.sort; render(); return; }
  const v = e.target.closest("[data-vault]");
  if (v) { state.vaultSel = +v.dataset.vault; render(); return; }
  const y = e.target.closest("[data-year]");
  if (y) { state.year = y.dataset.year; render(); return; }
});

$("#t-theme").onclick = () => {
  const el = document.documentElement;
  el.dataset.theme = el.dataset.theme === "light" ? "dark" : "light";
};
$("#t-caps").onclick = (e) => {
  const on = document.body.dataset.caps === "on";
  document.body.dataset.caps = on ? "off" : "on";
  e.currentTarget.setAttribute("aria-pressed", String(!on));
};
$("#t-empty").onclick = (e) => {
  state.empty = !state.empty;
  e.currentTarget.setAttribute("aria-pressed", String(state.empty));
  location.hash = "#/library"; render();
};

/* ---------------------------------------------------------------------------
   THE LAYOUT SHUFFLER. Six whole-app arrangements; the CSS is at the end of the
   stylesheet. Order is deliberate: 1 is the proposal in the handoff spec and
   every other one is a named argument against a specific part of it, so
   pressing L repeatedly walks the disagreement rather than a preference list.
   State lives on <html>, which is why a route change does not reset it.
   --------------------------------------------------------------------------- */
const LAYOUTS = [
  ["open",   "top bar · wall of years · three-column desk (the spec)"],
  ["rail",   "fixed nav column · desk index as a chip row"],
  ["focus",  "one reading proud · tiny wall · both rails stacked right"],
  ["column", "one measure · everything stacked · nothing sticky"],
  ["panels", "raised cards with edges instead of air"],
  ["split",  "reading column stays put while the shelf scrolls"],
];
let layoutIdx = 0;
function applyLayout() {
  const [id, why] = LAYOUTS[layoutIdx];
  document.documentElement.dataset.layout = id;
  $("#layout-name").textContent = `${layoutIdx + 1}/${LAYOUTS.length} · ${id} — ${why}`;
}
$("#t-layout").onclick = () => { layoutIdx = (layoutIdx + 1) % LAYOUTS.length; applyLayout(); };
addEventListener("keydown", (e) => {
  if (e.key !== "l" && e.key !== "L") return;
  if (/^(INPUT|TEXTAREA)$/.test(document.activeElement?.tagName || "")) return;
  $("#t-layout").click();
});

/* `rail` fixes the shell to the window, and the scaffolding strip is above it
   and wraps at narrow widths — so its height is measured, never assumed. */
const setProtoH = () =>
  document.documentElement.style.setProperty("--proto-h", $("#proto").offsetHeight + "px");
addEventListener("resize", setProtoH);
setProtoH();
applyLayout();

if (!location.hash) location.hash = "#/library";
render();
</script>
</body>
</html>
