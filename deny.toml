# cargo-deny config. `check bans licenses sources` gates PRs; `check advisories`
# runs on the scheduled workflow only, because the advisory DB moves on its own
# schedule and would otherwise red PRs for reasons their author cannot fix.

[graph]
# The app is only ever built for the machine in front of it. Restricting the
# graph keeps Windows-only and wasm-only crates out of the ban/license report.
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-apple-darwin" },
]

[advisories]
version = 2

# Every entry below is an `unmaintained` advisory whose own text ends "Solution:
# No safe upgrade is available!" — none is a vulnerability, and none of them is
# reachable by a `cargo update` from here. They are listed individually rather
# than waved through with a blanket `unmaintained = "warn"`, for the same reason
# the licence allowlist names every licence: a *new* unmaintained crate arriving
# with a routine update must still turn this job red.
#
# Re-read this list whenever Tauri's Linux stack moves. Fourteen of the
# seventeen disappear the day Tauri v2 targets GTK4 instead of GTK3, and the
# right response then is to delete them, not to renew them.
ignore = [
    # --- the gtk-rs GTK3 bindings, archived upstream in favour of gtk4-rs. ---
    # Tauri v2 renders on Linux through GTK3 + WebKitGTK (tauri -> wry/tao/muda
    # -> gtk 0.18), so this whole family arrives with `readingbuddy-gui` and
    # leaves only when Tauri does. It is also Linux-only: the macOS build links
    # WKWebView and none of this.
    { id = "RUSTSEC-2024-0411", reason = "gdkwayland-sys, via tauri's GTK3 stack" },
    { id = "RUSTSEC-2024-0412", reason = "gdk, via tauri's GTK3 stack" },
    { id = "RUSTSEC-2024-0413", reason = "atk, via tauri's GTK3 stack" },
    { id = "RUSTSEC-2024-0414", reason = "gdkx11-sys, via tauri's GTK3 stack" },
    { id = "RUSTSEC-2024-0415", reason = "gtk, via tauri's GTK3 stack" },
    { id = "RUSTSEC-2024-0416", reason = "atk-sys, via tauri's GTK3 stack" },
    { id = "RUSTSEC-2024-0417", reason = "gdkx11, via tauri's GTK3 stack" },
    { id = "RUSTSEC-2024-0418", reason = "gdk-sys, via tauri's GTK3 stack" },
    { id = "RUSTSEC-2024-0419", reason = "gtk3-macros, via tauri's GTK3 stack" },
    { id = "RUSTSEC-2024-0420", reason = "gtk-sys, via tauri's GTK3 stack" },

    # proc-macro-error, reached through glib-macros — the same GTK3 stack, so
    # it goes when that does.
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error, via glib-macros in tauri's GTK3 stack" },

    # The unic-* family, all reached through urlpattern -> tauri-utils. A
    # build-time Unicode table; nothing here parses user data with it.
    { id = "RUSTSEC-2025-0075", reason = "unic-char-range, via urlpattern in tauri-utils" },
    { id = "RUSTSEC-2025-0080", reason = "unic-common, via urlpattern in tauri-utils" },
    { id = "RUSTSEC-2025-0081", reason = "unic-char-property, via urlpattern in tauri-utils" },
    { id = "RUSTSEC-2025-0098", reason = "unic-ucd-version, via urlpattern in tauri-utils" },
    { id = "RUSTSEC-2025-0100", reason = "unic-ucd-ident, via urlpattern in tauri-utils" },

    # The one entry that is NOT the GUI's fault: `paste` is a macro-only crate
    # pulled in by ratatui, and so rides on the TUI rather than on tauri. It
    # expands to token concatenation at compile time and is absent from the
    # shipped binary; it clears when ratatui drops it.
    { id = "RUSTSEC-2024-0436", reason = "paste, via ratatui; proc-macro only, not in the shipped binary" },
]

[licenses]
version = 2
# Permissive only, with one deliberate exception. Anything else copyleft landing
# in the tree should be a visible decision, not something that arrives with a
# routine `cargo update` — which is exactly what this list is for.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    # `notify`, the mount watcher's event source. A public-domain dedication
    # with a permissive fallback licence — strictly *fewer* obligations than
    # MIT, nothing to reproduce and no notice to carry. Listed rather than
    # waved through because that is what this file is for: a copyleft or
    # source-available licence must not arrive with a routine `cargo update`,
    # and the only way to keep that true is to name every licence that does.
    "CC0-1.0",

    # DELIBERATE EXCEPTION, and the one entry here worth understanding.
    #
    # `epub` 2.1.4 is GPL-3.0, and the engine links it (epub.rs, and the
    # KOReader sibling-epub ISBN match path). GPL-3.0 is viral on linking, so a
    # *distributed* readingbuddy binary is effectively GPL-3.0 as a whole,
    # whatever this repo's own crates say.
    #
    # That is fine for a personal, source-shipped app and nothing here needs to
    # change today. It would need revisiting before publishing binaries under a
    # non-GPL licence — the fix would be replacing the `epub` crate (it does
    # zip + OPF/XML parsing; `zip` + `quick-xml` directly would cover what
    # epub.rs actually uses) rather than relicensing anything.
    "GPL-3.0",
]
confidence-threshold = 0.8

# The three workspace crates carry no `license` field and are `publish = false`;
# they aren't going to crates.io, so don't demand SPDX metadata from them.
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
# `readingbuddy = { path = "../engine" }` in cli/ and tui/ has no version, which
# reads as a wildcard. That is the normal way to depend across a workspace.
allow-wildcard-paths = true
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
