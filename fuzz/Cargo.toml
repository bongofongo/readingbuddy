# NOT a workspace member — see `exclude` in the root Cargo.toml. libfuzzer-sys
# needs nightly and `-Z sanitizer=address`; inside the workspace it would break
# `cargo build --workspace` on stable for everyone.
[package]
name = "readingbuddy-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
readingbuddy = { path = "../crates/engine" }
tempfile = "3"

[[bin]]
name = "parse_sidecar"
path = "fuzz_targets/parse_sidecar.rs"
test = false
doc = false
bench = false

[[bin]]
name = "epub_info"
path = "fuzz_targets/epub_info.rs"
test = false
doc = false
bench = false

# An empty table here is what detaches this crate from the parent workspace.
[workspace]
