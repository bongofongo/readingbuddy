[package]
name = "readingbuddy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# The `Engine::storage` escape hatch, for tests only.
#
# `tests/` is a separate crate, so it cannot reach a `pub(crate)` field — and
# item 14 made the field private precisely so no frontend could. A feature is
# how the engine's own suite keeps the access without handing it to anyone else,
# and the self dev-dependency below is how a package turns its own feature on
# for its own test targets. A frontend that wrote `engine.storage()` in
# production code would still fail `cargo check --workspace`, which is why CI
# runs one.
internals = []

[dependencies]
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
url.workspace = true
epub.workspace = true
lopdf.workspace = true
sqlx.workspace = true
time.workspace = true
futures.workspace = true
thiserror.workspace = true
async-trait.workspace = true
strsim.workspace = true
mlua.workspace = true
sha2.workspace = true
# System randomness for the pairing token and device id (item 15a). Already in
# the graph via `rand_core`; MIT/Apache-2.0, so `cargo deny` is unaffected.
getrandom = "0.3"
md-5.workspace = true
# Item 15b: `pairing.lua` names each paired computer, and the honest name is the
# hostname — the same string the router already registers, so the menu label and
# the discovery ladder's DNS rung are one value rather than two that can
# disagree. Already resolved in `Cargo.lock` via a transitive dependency, so
# this changes nothing about the graph; Apache-2.0/MIT, so `cargo deny` is
# unaffected.
gethostname = "1"
# Item 15b: the pairing token is a challenge-response credential, so the
# rendezvous needs HMAC-SHA256 on this side of the language boundary. `sha2` is
# already a direct dependency and `hmac` is already resolved in `Cargo.lock`
# via a transitive path, so this changes nothing about the graph;
# MIT/Apache-2.0, so `cargo deny` is unaffected.
hmac = "0.12"
# Item 20: covers are measured (width, height, border accent) and downscaled
# once, at the moment they are written, so a shelf of three hundred spines is
# one query rather than three hundred image decodes. The same crate the TUI's
# renderer already links, at the same workspace feature set — the engine is now
# where a cover is *decoded*, `render3d` is where one is drawn.
image.workspace = true
regex.workspace = true
csv.workspace = true
tracing.workspace = true
# `sync` is the mount watcher's channel seam; `time` is the provider timeout
# and the watcher's debounce; `process` is how calibre's binaries are run —
# `ebook-convert` on a large book takes minutes, and blocking the executor for
# that would stop every other task in the frontend.
tokio = { workspace = true, features = ["time", "sync", "process"] }
notify.workspace = true
# Item 31 copies the device's live `statistics.sqlite3` out before reading it,
# and the copy has to land somewhere private that is cleaned up even when the
# read fails. It was already a dev-dependency; this promotes it.
tempfile = "3"

[dev-dependencies]
# A package depending on itself, which cargo permits for dev-dependencies and
# which is the only way to switch a feature on for one's own `tests/`.
readingbuddy = { path = ".", features = ["internals"] }
tempfile = "3"
proptest = "1"
# Test payloads for `partial_md5` are generated, never committed as a binary.
# ChaCha8 specifically, per the corpus rule: StdRng's algorithm is explicitly
# permitted to change between `rand` versions, which is how a "deterministic"
# fixture quietly stops being deterministic.
rand_chacha = "0.9"
rand_core = "0.9"
# Builds the ISBN-less epub that `engine_facade.rs` imports. It has to be built
# rather than committed *and* it has to lack an ISBN: `import_epub` looks a
# found ISBN up through the providers, and the suite makes no network calls.
zip = { version = "2", default-features = false, features = ["deflate"] }
wiremock = "0.6"
# For the redaction test's capturing layer only. The engine itself must never
# depend on a subscriber.
tracing-subscriber.workspace = true
# `test-util` is what makes the 5s provider timeout testable in zero wall
# time, via #[tokio::test(start_paused = true)].
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "test-util"] }
serde_json.workspace = true
