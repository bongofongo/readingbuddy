[package]
name = "readingbuddy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
url.workspace = true
epub.workspace = true
sqlx.workspace = true
time.workspace = true
futures.workspace = true
thiserror.workspace = true
async-trait.workspace = true
strsim.workspace = true
mlua.workspace = true
sha2.workspace = true
regex.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
tempfile = "3"
proptest = "1"
wiremock = "0.6"
# For the redaction test's capturing layer only. The engine itself must never
# depend on a subscriber.
tracing-subscriber.workspace = true
# `test-util` is what makes the 5s provider timeout testable in zero wall
# time, via #[tokio::test(start_paused = true)].
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "test-util"] }
serde_json.workspace = true
