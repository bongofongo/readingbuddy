[package]
name = "readingbuddy-tui"
version.workspace = true
edition.workspace = true

[[bin]]
name = "readingbuddy-tui"
path = "src/main.rs"

[dependencies]
readingbuddy = { path = "../engine" }
anyhow.workspace = true
clap.workspace = true
ratatui.workspace = true
crossterm.workspace = true
arboard.workspace = true
image.workspace = true
flate2.workspace = true
base64.workspace = true
futures.workspace = true
serde.workspace = true
# The perf log is JSONL: one frame per line, so two runs can be diffed
# mechanically rather than eyeballed.
serde_json.workspace = true
toml.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

# The capability probe polls the tty directly for terminal query replies.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
# Only to assert that a kitty placeholder cell measures one column wide — if it
# ever measured two, ratatui's buffer diff would skip every second cell.
unicode-width = "0.2"
