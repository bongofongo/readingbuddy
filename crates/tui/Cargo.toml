[package]
name = "readingbuddy-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "readingbuddy-tui"
path = "src/main.rs"

[dependencies]
readingbuddy = { path = "../engine" }
anyhow.workspace = true
clap.workspace = true
ratatui.workspace = true
crossterm.workspace = true
arboard.workspace = true
image.workspace = true
flate2.workspace = true
base64.workspace = true
futures.workspace = true
serde.workspace = true
# The perf log is JSONL: one frame per line, so two runs can be diffed
# mechanically rather than eyeballed.
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
toml.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

# The capability probe polls the tty directly for terminal query replies.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
# Only to assert that a kitty placeholder cell measures one column wide — if it
# ever measured two, ratatui's buffer diff would skip every second cell.
unicode-width = "0.2"
# `test_app` seeds a highlight and a flashcard directly, and both are write
# paths the facade deliberately does **not** have: a highlight comes off a
# device and a flashcard is derived from one, so inventing `Engine::add_*` to
# make a fixture compile would be adding product surface no product asked for.
# The `internals` feature is the door item 14 left for exactly this. It is a
# dev-dependency, so the shipped binary never has it.
readingbuddy = { path = "../engine", features = ["internals"] }
