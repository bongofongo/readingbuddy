name: Scheduled

# The things that must not gate a PR, because they fail for reasons a PR author
# cannot fix: a newly-published advisory, a new clippy lint on floating stable.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # The tier-2 corpus, and this job is overdue.
  #
  # `corpus/generated` is gitignored, so on a runner every test in
  # tests/corpus.rs takes its `SKIPPED:` path and passes without asserting
  # anything. That is not a theoretical hole: it is exactly how the corpus
  # convergence bug survived — introduced by build item 2, invisible to CI, and
  # found weeks later only because someone ran `make corpus` by hand.
  #
  # It belongs here and not on the PR gate for the usual reason: it downloads
  # thirty epubs from Project Gutenberg, and Gutenberg being slow or down is not
  # something a PR author can fix. It also *cannot* run anywhere else — a cloud
  # agent sandbox cannot reach gutenberg.org at all (the proxy refuses the
  # CONNECT), so a hosted runner is the only machine that can build this tier.
  corpus:
    name: tier-2 corpus
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2

      # Keyed on the manifest, which carries the ids AND the sha256s — so a
      # re-issued text changes the key and gets re-fetched rather than being
      # served stale from the cache and then failing checksum verification.
      - uses: actions/cache@v4
        with:
          path: corpus/epub
          key: corpus-epub-${{ hashFiles('corpus/manifest.json') }}

      # REQUIRE_FIXTURES is the switch that turns every `SKIPPED:` into a
      # failure. It is scoped to this job deliberately: set globally it would
      # fail on `tests/fixtures/koreader/real/`, which is gitignored and is
      # never present on a runner by design, and on partial_md5.rs's
      # opportunistic personal_data/ checks.
      - run: make corpus
        env:
          READINGBUDDY_REQUIRE_FIXTURES: "1"

  advisories:
    name: security advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories

  floating-stable:
    name: clippy on floating stable
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Advisory only. This exists so a new lint is *visible* before the pinned
    # toolchain in rust-toolchain.toml is bumped — never so it blocks anything.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # Same reason as the `check` job in ci.yml, which carries the argument:
      # resolving the whole workspace pulls in the GUI's Tauri backend, and the
      # runner ships no GTK3/WebKit headers. Repeated rather than shared because
      # the Actions parser has no anchors — keep the four copies in step.
      - name: GTK + WebKit headers for the Tauri backend
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev
      - uses: Swatinem/rust-cache@v2
      # RUSTUP_TOOLCHAIN is what overrides rust-toolchain.toml's pin — this is
      # the one job that deliberately ignores it.
      - run: cargo clippy --workspace --all-targets -- -D warnings
        env:
          RUSTUP_TOOLCHAIN: stable
