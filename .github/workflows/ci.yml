name: CI

on:
  push:
    branches: [main]
    # `paths-ignore`, deliberately, rather than a `paths` allowlist: with branch
    # protection an allowlist leaves required checks stuck "pending" forever on
    # a docs-only PR, which is then unmergeable for no reason.
    # Duplicated below rather than shared via a YAML anchor — the Actions
    # workflow parser does not support anchors/aliases.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "perf/**"
      - ".gitignore"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "perf/**"
      - ".gitignore"

# No DATABASE_URL anywhere below, and that is correct — this crate uses runtime
# `sqlx::query()` only (zero `query!` macros, no `.sqlx/`), and the
# `sqlx::migrate!` in storage/mod.rs is a compile-time *file* read. Nothing here
# needs a database. Please don't helpfully add one.
#
# No toolchain action either: the runners ship rustup, which reads
# rust-toolchain.toml and installs the pinned version plus its components on the
# first cargo call. Adding a setup action would just fight the pin.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: fmt + clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # The GUI's Tauri backend is a workspace member on purpose — that is what
      # puts `readingbuddy-gui` inside `cargo check --workspace` and makes
      # reaching past the API a CI failure rather than an 11pm decision. The
      # price is that every job resolving the whole workspace now links
      # webkit2gtk and GTK3, and the runner image ships neither their headers
      # nor their .pc files. Without this step `glib-sys` fails its build script
      # and the job dies before compiling a line of this repo's own code.
      - name: GTK + WebKit headers for the Tauri backend
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check

      # --all-targets subsumes `cargo check`, so there is no separate build job.
      # And it covers the *whole workspace*, not just the engine: an engine-only
      # gate that lets a change to `SearchOutcome` break the CLI is not a gate.
      # `-D warnings` lives here rather than in RUSTFLAGS — as an env var it
      # would invalidate the cache against every local build.
      #
      # `--locked` on both: Cargo.lock is committed, and `epub = "=2.1.4"` is
      # pinned exactly *because* a lockfile once picked up a breaking change in a
      # patch release. Without --locked nothing detects that recurring.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Not redundant with the line above, and the difference is the point.
      # `--all-targets` resolves dev-dependencies, and `crates/tui`'s switch on
      # the engine's `internals` feature — the door item 14 left open for test
      # fixtures to reach `Engine::storage()`. Under clippy that door is open
      # for the shipped binaries too. This is the build where it is shut, so a
      # frontend that reopens the seam in production code fails here and only
      # here.
      - run: cargo check --workspace --locked

      # The generated TypeScript is COMMITTED, so a thread that cannot run cargo
      # still reads current types. This is what stops that copy going stale
      # silently: a DTO change without a `make ts` fails here rather than becoming
      # a blank panel in a webview with a console error nobody is reading.
      # In the `check` job rather than its own, because it needs the same Rust
      # toolchain and cache and no node at all.
      - run: make ts-check

  frontend:
    name: svelte-check + eslint + vitest + routes
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: gui/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: gui

      # `--frozen-lockfile` above is the `--locked` of this half of the repo, for
      # the same reason: a lockfile that drifts on CI is a build nobody can
      # reproduce. pnpm only, never npm or yarn — a second lockfile is a silent
      # divergence.
      - run: make web-check

      # Layer 2. Playwright's WebKit, because WKWebView is what the app ships
      # inside on macOS, so WebKit's bugs are ours — and because `tauri-driver`
      # cannot run on macOS at all, which is why the visual gate lives in a
      # browser rather than in the real binary. See docs/gui/testing.md.
      - run: pnpm exec playwright install --with-deps webkit
        working-directory: gui
      - run: make routes

      # A failing shot is only diagnosable if you can see it.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: gui/playwright-report
          retention-days: 7

  test:
    name: tests — ${{ matrix.scope }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Asymmetric on purpose.
        #
        # ubuntu runs the WHOLE workspace. The TUI's suite used to be out of
        # scope here, on the argument that the engine is what this gates — but
        # that only held while every TUI change was written and run by hand on
        # the dev machine. It no longer is, and the suite contains
        # `every_screen_draws_at_every_size`, which is the one thing standing
        # between a layout bug and a panic in the user's tmux pane. It is
        # headless (ratatui TestBackend), so it needs nothing a runner lacks.
        #
        # macOS stays engine-only. It earns its slot for the two C dependencies
        # that build differently there (vendored lua54, libsqlite3-sys), not for
        # layout arithmetic — running the ray tracer twice buys nothing. Free
        # here because the repo is public; on a private repo these bill at 10x
        # and should move to the scheduled workflow instead.
        include:
          - os: ubuntu-latest
            scope: whole workspace
            args: --workspace
          - os: macos-latest
            scope: engine
            args: -p readingbuddy
    steps:
      - uses: actions/checkout@v4
      # Same reason as the `check` job in ci.yml, which carries the argument:
      # resolving the whole workspace pulls in the GUI's Tauri backend, and the
      # runner ships no GTK3/WebKit headers. Repeated rather than shared because
      # the Actions parser has no anchors — keep the four copies in step.
      - name: GTK + WebKit headers for the Tauri backend
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - run: cargo nextest run ${{ matrix.args }} --locked

  migrations:
    name: migrations are append-only
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # The diff needs the merge base, which the default shallow clone
          # does not have.
          fetch-depth: 0

      # CLAUDE.md's "never edit an applied migration" as a check rather than a
      # convention. sqlx records a checksum of every migration it has applied, so
      # editing one in place breaks every database that already ran it — with an
      # error that names the checksum and not the cause. Parallel branches are
      # what make this worth mechanising: the rule is easy to keep in one thread
      # and easy to forget across three.
      #
      # M, D and R alike: a migration that is modified, deleted, or renamed is a
      # migration whose recorded checksum no longer describes it.
      - name: refuse a modified, deleted or renamed migration
        run: |
          # `*.sql` only, not the whole directory. What sqlx checksums is the
          # migration files; `crates/engine/migrations/CLAUDE.md` lives in here
          # too, and editing the documentation about migrations is not editing
          # an applied migration. Without the glob this gate fails any PR that
          # improves that file — which is exactly what it did.
          changed=$(git diff --diff-filter=MDR --name-only \
            "${{ github.event.pull_request.base.sha }}...HEAD" \
            -- 'crates/engine/migrations/*.sql')
          if [ -n "$changed" ]; then
            echo "::error::an applied migration was changed, not added:"
            echo "$changed"
            echo
            echo "Add a new numbered migration instead. See CLAUDE.md, Conventions."
            exit 1
          fi
          echo "migrations are append-only in this PR."

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # bans + licenses + sources only. `advisories` is on the scheduled
      # workflow instead: the advisory DB moves independently of this repo, so
      # running it here would red PRs for a reason their author cannot fix.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans licenses sources
