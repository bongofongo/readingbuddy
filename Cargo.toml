[workspace]
resolver = "3"
members = ["crates/engine", "crates/cli", "crates/tui"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = { version = "2.5.7", features = ["serde"] }
epub = "2.1.4"
tokio = { version = "1" }
sqlx = { version = "0.8.6", features = ["sqlite", "runtime-tokio-rustls", "json", "time"] }
anyhow = "1.0.100"
time = { version = "0.3.44", features = ["macros", "formatting", "parsing"] }
futures = "0.3.31"
thiserror = "2"
async-trait = "0.1"
strsim = "0.11"
mlua = { version = "0.10", features = ["lua54", "vendored", "serialize"] }
sha2 = "0.10"
regex = "1"
clap = { version = "4", features = ["derive", "env"] }
toml = "0.8"
rpassword = "7"
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
