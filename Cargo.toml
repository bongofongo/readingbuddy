[workspace]
resolver = "3"
members = [
    "crates/engine",
    "crates/api",
    "crates/daemon",
    "crates/cli",
    "crates/tui",
    "crates/corpus",
    # The Tauri backend (spec item 25). A workspace member so that
    # `cargo check --workspace` — the build where the engine's `internals`
    # feature is OFF — covers it too. That is the job it does here: it is what
    # makes reaching past `readingbuddy-api` into the engine a compile error in
    # CI rather than a decision somebody makes at 11pm.
    "gui/src-tauri",
]
# cargo-fuzz needs nightly and a sanitizer flag; leaving it in would break
# `cargo build --workspace` on stable. (fuzz/Cargo.toml also carries its own
# empty [workspace] — belt and braces.)
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Edition 2024 needs 1.85; the let-chains in `lib.rs` need 1.88. Declaring it
# buys a clear cargo error instead of a syntax error on an older toolchain.
rust-version = "1.88"
# Not going to crates.io. Also what lets cargo-deny's `private.ignore` skip the
# "unlicensed crate" check on these three.
publish = false

# A release backtrace is bare addresses without this, which makes the crash log
# worthless.
#
# This used to say it cost "a few MB of binary and nothing else". Measured when
# the release pipeline went in, the line tables are 90 MB of the TUI's 112 MB —
# free on this machine, and not free over a network, which is what `dist` below
# is for.
[profile.release]
debug = "line-tables-only"
strip = "none"

# What .github/workflows/release.yml ships, and the only difference from
# `release` is what the download costs: 22 MB against 112, ~15 MB of archive
# against 53.
#
# `strip = "debuginfo"` and NOT `"symbols"`. The symbol table is the cheap half
# — dropping the line tables is where the 90 MB goes — and it is what keeps a
# crash log naming `readingbuddy_tui::app::draw` instead of `0x55f3a1c04e20`.
# A frame without a line number still says which function; a bare address says
# nothing, which is exactly what the profile above exists to prevent.
#
# Local builds are untouched: `cargo build --release` still carries everything,
# so a crash on the dev machine is diagnosed with the file and line it has
# always had.
[profile.dist]
inherits = "release"
strip = "debuginfo"

[workspace.dependencies]
# `default-features = false` is load-bearing: the defaults pull native-tls ->
# openssl-sys, which a CI runner then needs libssl-dev for. sqlx already speaks
# rustls, so this drops a C dependency rather than adding one. Note rustls-tls
# bundles webpki-roots and ignores the system trust store — swap to
# rustls-tls-native-roots if a TLS-intercepting proxy ever gets in the way.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "http2",
    "charset",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = { version = "2.5.7", features = ["serde"] }
# Pinned EXACTLY, not caret. 2.1.5 is a patch release that changed the metadata
# map's value type from String to MetadataItem — a breaking change shipped in a
# patch bump, which a caret constraint happily accepts. Found because the fuzz
# crate resolves its own lockfile and picked 2.1.5; the same would happen on any
# `cargo update`. Unpinning means porting epub.rs, and gains nothing until this
# dependency is replaced outright (see the GPL-3.0 note in deny.toml).
epub = "=2.1.4"
tokio = { version = "1" }
sqlx = { version = "0.8.6", features = ["sqlite", "runtime-tokio-rustls", "json", "time"] }
anyhow = "1.0.100"
time = { version = "0.3.44", features = ["macros", "formatting", "parsing"] }
futures = "0.3.31"
thiserror = "2"
async-trait = "0.1"
strsim = "0.11"
mlua = { version = "0.10", features = ["lua54", "vendored", "serialize"] }
sha2 = "0.10"
# KOReader's `util.partialMD5` is MD5 and nothing else, so agreeing with the
# device means MD5. RustCrypto, sibling of `sha2` above, same `digest` traits —
# MIT OR Apache-2.0, already inside deny.toml's allow list.
md-5 = "0.10"
regex = "1"
# Goodreads' interface is a CSV file, both directions (their API died in
# December 2020). Quoting, embedded newlines and CRLF are exactly the parts a
# hand-rolled splitter gets wrong on the first real export. Unlicense OR MIT.
csv = "1"
# The engine emits only — it must never install a subscriber, or it would be
# deciding I/O policy for its frontends. tracing-subscriber lives in cli/tui.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "registry"] }
tracing-appender = "0.2"
clap = { version = "4", features = ["derive", "env"] }
toml = "0.8"
rpassword = "7"
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
arboard = "3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
# Already in the lock tree via `image`; promoted to direct deps for the kitty
# graphics path (zlib-compressed, base64-armoured image payloads).
flate2 = "1.1"
base64 = "0.22"
libc = "0.2"
# Noticing a reader arriving, rather than being told about it. Only the thin
# adapter in `watch.rs` touches it — the debounce it feeds is driven by a
# channel, so the part with the logic in it is testable without hardware.
# CC0-1.0, which is a deliberate entry in deny.toml's allow list.
notify = { version = "8.2", default-features = false, features = ["macos_fsevent"] }
